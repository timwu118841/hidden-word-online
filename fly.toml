# Single instance by design: live rooms are in memory (see plan §2 Decision B).
app = "hidden-word-online"
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  SCORER = "llm"
  DATABASE_PATH = "/data/hidden-word.sqlite"

[mounts]
  source = "hw_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
